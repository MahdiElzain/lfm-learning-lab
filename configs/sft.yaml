# Lesson C: supervised fine-tuning on robot dispatch.
# Change ONE thing at a time with --set, e.g. --set lora_r=4 or --set learning_rate=5e-5
defaults:
  model: text_instruct           # registry key in configs/models.yaml
  method: lora                   # lora | full
  seed: 0
  n_train: 1000                  # training examples taken from data/robot/train.jsonl
  n_val: 100
  learning_rate: 2.0e-4          # LoRA default; full fine-tuning uses ~2e-5
  lora_r: 16
  lora_alpha: 32                 # scaling = alpha / r
  lora_dropout: 0.05
  # Verified by scripts/text/02_inspect_architecture.py: LFM2 linear layers are
  # q_proj k_proj v_proj out_proj (attention), in_proj out_proj (conv), w1 w2 w3 (MLP).
  target_modules: [q_proj, k_proj, v_proj, out_proj, in_proj, w1, w2, w3]
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2   # effective batch = 8 * 2 = 16 sequences per update
  num_train_epochs: 1
  max_steps: -1                    # >0 overrides epochs
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  completion_only_loss: true       # false = also train on the prompt tokens
  gradient_checkpointing: false
  max_length: 512
  optim: adamw_torch
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  eval_limit_test: 300
  eval_limit_ood: 200
  save_full_model: false
  load_in_4bit: false            # true = QLoRA (needs bitsandbytes)
presets:
  quick:    {n_train: 1000, num_train_epochs: 1, eval_limit_test: 300, eval_limit_ood: 200}
  standard: {n_train: 3000, num_train_epochs: 2}
  extended: {n_train: 3000, num_train_epochs: 4, lora_r: 32, lora_alpha: 64}
